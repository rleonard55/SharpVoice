<!doctype html>
<html lang="en" data-outcome="{{OUTCOME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{HEADING}} · SharpVoice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23171b22'/%3E%3Cg fill='none' stroke='%2386beff' stroke-width='2.3' stroke-linecap='round'%3E%3Crect x='12' y='5' width='8' height='14' rx='4'/%3E%3Cpath d='M8 15a8 8 0 0 0 16 0M16 23v4m-4 0h8'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bg:#f5f7fa;--surface:#fff;--text:#192433;--muted:#596879;--border:#dce3eb;--accent:#0067c0;--wash:#e6f0ff;--inset:#f4f7fb;--result:#a12d39;--result-bg:#fff0f1;--shadow:0 24px 80px #18334d12,0 2px 8px #18334d06}
:root[data-outcome=success]{--result:#176c49;--result-bg:#edf9f2}
@media(prefers-color-scheme:dark){:root{--bg:#131820;--surface:#1c2430;--text:#f2f5fa;--muted:#b3c1d1;--border:#354150;--accent:#91c6ff;--wash:#233d5c;--inset:#242e3b;--result:#ffb0b5;--result-bg:#3e2933;--shadow:0 24px 80px #0004,0 2px 8px #0002}:root[data-outcome=success]{--result:#8be0b6;--result-bg:#213a34}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 0,var(--wash),transparent 65%),var(--bg);color:var(--text);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shell{width:min(100%,560px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px;font-size:25px;font-weight:650;letter-spacing:-.035em}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--accent)}svg{display:block}.card{padding:42px 38px 30px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow)}.eyebrow{margin:0 0 28px;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}.status-icon{display:grid;place-items:center;width:80px;height:80px;margin:0 auto 22px;border-radius:50%;background:var(--result-bg);color:var(--result)}.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;margin-bottom:14px;border-radius:99px;background:var(--result-bg);color:var(--result);font-size:12px;font-weight:650}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}h1{margin:0 0 14px;font-size:clamp(27px,5vw,36px);line-height:1.2;font-weight:650;letter-spacing:-.035em}.description{max-width:420px;margin:0 auto 30px;font-size:16px;line-height:1.65;color:var(--muted)}.next-step{padding:18px 16px;background:var(--inset);border-radius:16px}.next-step strong{display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:600}.next-step svg{color:var(--accent)}.next-step p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.tagline{text-align:center;margin:24px 0 0;font-size:13px;color:var(--muted)}
@media(max-width:420px){body{padding:24px 16px}.brand{margin-bottom:20px}.card{padding:30px 22px 22px;border-radius:24px}.eyebrow{margin-bottom:24px}.description{font-size:15px}.status-icon{width:72px;height:72px}}
</style>
</head>
<body>
<div class="shell">
<header class="brand" aria-label="SharpVoice">
<span class="brand-mark"><svg width="26" height="30" viewBox="0 0 32 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="11" y="3" width="10" height="19" rx="5"/><path d="M6 17a10 10 0 0 0 20 0M16 27v6m-5 0h10"/></svg></span>
<span>SharpVoice</span>
</header>
<main class="card" aria-labelledby="result-heading">
<p class="eyebrow">ChatGPT · Account connection</p>
<div class="status-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">{{ICON}}</svg></div>
<div class="badge"><span class="dot" aria-hidden="true"></span>{{STATUS}}</div>
<h1 id="result-heading">{{HEADING}}</h1>
<p class="description">{{DESCRIPTION}}</p>
<div class="next-step"><strong><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>{{NEXT}}</strong><p>You can close this tab.</p></div>
</main>
<footer class="tagline">Your voice. Your words. Wherever you work.</footer>
</div>
<script>{{CLEAN_HISTORY}}</script>
</body>
</html>
